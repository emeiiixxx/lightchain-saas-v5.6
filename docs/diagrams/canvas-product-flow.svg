<polygon points="1214,841 1205,836 1205,846" fill="#238A85"/>
<polyline points="1326,841 1372,841" fill="none" stroke="#238A85" stroke-width="2" stroke-linejoin="round"/>
<polygon points="1372,841 1363,836 1363,846" fill="#238A85"/>
