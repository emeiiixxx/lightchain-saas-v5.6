<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1730" viewBox="0 0 1480 1730">
<rect x="0" y="0" width="1480" height="1730" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.6"/>
<text x="48" y="52" font-family="Noto Sans SC, sans-serif" font-size="30" font-weight="600" fill="#19344B" text-anchor="start">SaaS v5.3 · 画布浏览与整理</text>
<ellipse cx="740" cy="118" rx="165" ry="28" fill="#EAF7F5" stroke="#238A85" stroke-width="1.6"/>
<text x="740" y="125" font-family="Noto Sans SC, sans-serif" font-size="21" font-weight="400" fill="#19344B" text-anchor="middle">进入已有内容的画布</text>
<polyline points="740,146 740,186" fill="none" stroke="#7D91A1" stroke-width="2" stroke-linejoin="round"/>
<polygon points="740,186 735,177 745,177" fill="#7D91A1"/>
<polygon points="740,186 910,244 740,302 570,244" fill="#FFF8E9" stroke="#BD924B" stroke-width="1.6"/>
<text x="740" y="237" font-family="Noto Sans SC, sans-serif" font-size="21" font-weight="400" fill="#19344B" text-anchor="middle">当前视窗内</text>
<text x="740" y="267" font-family="Noto Sans SC, sans-serif" font-size="21" font-weight="400" fill="#19344B" text-anchor="middle">是否有节点？</text>
<text x="280" y="226" font-family="Noto Sans SC, sans-serif" font-size="20" font-weight="400" fill="#5C7080" text-anchor="middle">部分可见也视为「有」</text>
<text x="280" y="258" font-family="Noto Sans SC, sans-serif" font-size="20" font-weight="400" fill="#5C7080" text-anchor="middle">空画布不显示「回到节点」</text>
<polyline points="910,244 1020,244" fill="none" stroke="#7D91A1" stroke-width="2" stroke-linejoin="round"/>
<polygon points="1020,244 1011,239 1011,249" fill="#7D91A1"/>
<text x="965" y="227" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" fill="#5C7080" text-anchor="middle">无</text>
<rect x="1020" y="196" width="370" height="96" rx="14" fill="#F0F6FD" stroke="#367DC4" stroke-width="1.6"/>
<text x="1205.0" y="236.0" font-family="Noto Sans SC, sans-serif" font-size="21" font-weight="400" fill="#19344B" text-anchor="middle">点击「回到节点」</text>
<text x="1205.0" y="266.0" font-family="Noto Sans SC, sans-serif" font-size="21" font-weight="400" fill="#19344B" text-anchor="middle">按全部节点边界适应视窗</text>
<polyline points="1205,292 1205,328 740,328" fill="none" stroke="#7D91A1" stroke-width="2" stroke-linejoin="round"/>
<polyline points="740,302 740,360" fill="none" stroke="#7D91A1" stroke-width="2" stroke-linejoin="round"/>
<polygon points="740,360 735,351 745,351" fill="#7D91A1"/>
<text x="707" y="333" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" fill="#5C7080" text-anchor="end">有</text>
<ellipse cx="740" cy="388" rx="128" ry="28" fill="#EAF7F5" stroke="#367DC4" stroke-width="1.6"/>
<text x="740" y="395" font-family="Noto Sans SC, sans-serif" font-size="21" font-weight="400" fill="#19344B" text-anchor="middle">按需选择操作</text>
<polyline points="612,388 250,388 250,456" fill="none" stroke="#7D91A1" stroke-width="2" stroke-linejoin="round"/>
<polygon points="250,456 245,447 255,447" fill="#7D91A1"/>
<polyline points="868,388 970,388 970,456" fill="none" stroke="#7D91A1" stroke-width="2" stroke-linejoin="round"/>
<polygon points="970,456 965,447 975,447" fill="#7D91A1"/>
<text x="250" y="439" font-family="Noto Sans SC, sans-serif" font-size="23" font-weight="600" fill="#367DC4" text-anchor="middle">定位浏览</text>
<text x="970" y="439" font-family="Noto Sans SC, sans-serif" font-size="23" font-weight="600" fill="#238A85" text-anchor="middle">整理画布</text>
<rect x="60" y="456" width="380" height="136" rx="14" fill="#F0F6FD" stroke="#367DC4" stroke-width="1.6"/>
<text x="250.0" y="501.0" font-family="Noto Sans SC, sans-serif" font-size="20" font-weight="400" fill="#19344B" text-anchor="middle">小地图定位 / 拖动可视框</text>
<text x="250.0" y="531.0" font-family="Noto Sans SC, sans-serif" font-size="20" font-weight="400" fill="#19344B" text-anchor="middle">选择倍率（含 3%、5%）</text>
<text x="250.0" y="561.0" font-family="Noto Sans SC, sans-serif" font-size="20" font-weight="400" fill="#19344B" text-anchor="middle">滚轮缩放 / 平移 / 适应屏幕</text>
<text x="80" y="653" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" fill="#5C7080" text-anchor="start">浏览只改变视图，不改变节点坐标。</text>
<text x="80" y="705" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" fill="#5C7080" text-anchor="start">视窗再次移出全部节点时，</text>
<text x="80" y="737" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" fill="#5C7080" text-anchor="start">可再次通过「回到节点」找回。</text>
<text x="80" y="831" font-family="Noto Sans SC, sans-serif" font-size="20" font-weight="600" fill="#367DC4" text-anchor="start">窗口尺寸变化</text>
<text x="80" y="866" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" fill="#5C7080" text-anchor="start">保持中心内容与倍率，不自动重排。</text>
<rect x="530" y="456" width="880" height="100" rx="14" fill="#EDF8F5" stroke="#238A85" stroke-width="1.6"/>
<text x="970.0" y="498.0" font-family="Noto Sans SC, sans-serif" font-size="22" font-weight="400" fill="#19344B" text-anchor="middle">纳入全部图片与编辑节点</text>
<text x="970.0" y="528.0" font-family="Noto Sans SC, sans-serif" font-size="22" font-weight="400" fill="#19344B" text-anchor="middle">包括视窗外内容、未选中内容及空编辑节点</text>
<polyline points="970,556 970,600" fill="none" stroke="#238A85" stroke-width="2" stroke-linejoin="round"/>
<polygon points="970,600 965,591 975,591" fill="#238A85"/>
<rect x="530" y="600" width="880" height="470" rx="14" fill="#EDF8F5" stroke="#238A85" stroke-width="1.6"/>
<text x="970" y="638" font-family="Noto Sans SC, sans-serif" font-size="24" font-weight="600" fill="#238A85" text-anchor="middle">按真实连接逐层整理</text>
<text x="970" y="671" font-family="Noto Sans SC, sans-serif" font-size="20" font-weight="400" fill="#19344B" text-anchor="middle">图片与编辑器独立排版；同源编辑器上下同列，下游步骤逐层向右</text>
<polyline points="678,841 706,841 706,751 738,751" fill="none" stroke="#238A85" stroke-width="2" stroke-linejoin="round"/>
<polygon points="738,751 729,746 729,756" fill="#238A85"/>
