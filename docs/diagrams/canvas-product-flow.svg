<polyline points="858,931 904,931" fill="none" stroke="#238A85" stroke-width="2" stroke-linejoin="round"/>
<polygon points="904,931 895,926 895,936" fill="#238A85"/>
<polyline points="1016,841 1054,841" fill="none" stroke="#238A85" stroke-width="2" stroke-linejoin="round"/>
<polygon points="1054,841 1045,836 1045,846" fill="#238A85"/>
