<rect x="904" y="723" width="112" height="56" rx="14" fill="#F0F6FD" stroke="#367DC4" stroke-width="1.6"/>
<text x="960.0" y="758.0" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" fill="#19344B" text-anchor="middle">结果 A</text>
<rect x="738" y="813" width="120" height="56" rx="14" fill="#EDF8F5" stroke="#238A85" stroke-width="1.6"/>
<text x="798.0" y="848.0" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" fill="#19344B" text-anchor="middle">编辑器 B</text>
<rect x="904" y="813" width="112" height="56" rx="14" fill="#F0F6FD" stroke="#367DC4" stroke-width="1.6"/>
<text x="960.0" y="848.0" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" fill="#19344B" text-anchor="middle">结果 B</text>
<rect x="738" y="903" width="120" height="56" rx="14" fill="#EDF8F5" stroke="#238A85" stroke-width="1.6"/>
<text x="798.0" y="938.0" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" fill="#19344B" text-anchor="middle">编辑器 C</text>
<rect x="904" y="903" width="112" height="56" rx="14" fill="#F0F6FD" stroke="#367DC4" stroke-width="1.6"/>
<text x="960.0" y="938.0" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" fill="#19344B" text-anchor="middle">结果 C</text>
<rect x="1054" y="813" width="124" height="56" rx="14" fill="#EDF8F5" stroke="#238A85" stroke-width="1.6"/>
<text x="1116.0" y="848.0" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="400" fill="#19344B" text-anchor="middle">后续编辑器</text>
<rect x="1214" y="813" width="112" height="56" rx="14" fill="#F0F6FD" stroke="#367DC4" stroke-width="1.6"/>
<text x="1270.0" y="848.0" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="400" fill="#19344B" text-anchor="middle">后续结果</text>
<text x="798" y="708" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="600" fill="#238A85" text-anchor="middle">同一列</text>
<text x="1360" y="806" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="400" fill="#5C7080" text-anchor="middle">继续延伸</text>
<text x="970" y="997" font-family="Noto Sans SC, sans-serif" font-size="20" font-weight="400" fill="#19344B" text-anchor="middle">同层左对齐 · 列边界间距 80 · 子分支间距 120</text>
<text x="970" y="1033" font-family="Noto Sans SC, sans-serif" font-size="20" font-weight="400" fill="#19344B" text-anchor="middle">父节点居中于整个后代区域；抠图结果只连直接来源图片</text>
<polyline points="970,1070 970,1114" fill="none" stroke="#238A85" stroke-width="2" stroke-linejoin="round"/>
<polygon points="970,1114 965,1105 975,1105" fill="#238A85"/>
<rect x="530" y="1114" width="880" height="92" rx="14" fill="#EDF8F5" stroke="#238A85" stroke-width="1.6"/>
<text x="970.0" y="1152.0" font-family="Noto Sans SC, sans-serif" font-size="21" font-weight="400" fill="#19344B" text-anchor="middle">按当前视窗安排不同关联组的外部排列</text>
<text x="970.0" y="1182.0" font-family="Noto Sans SC, sans-serif" font-size="21" font-weight="400" fill="#19344B" text-anchor="middle">关联组在左、独立图片在右；组间 120、两区间距 240</text>
<polyline points="970,1206 970,1250" fill="none" stroke="#238A85" stroke-width="2" stroke-linejoin="round"/>
<polygon points="970,1250 965,1241 975,1241" fill="#238A85"/>
<rect x="530" y="1250" width="880" height="82" rx="14" fill="#EDF8F5" stroke="#238A85" stroke-width="1.6"/>
<text x="970.0" y="1298.0" font-family="Noto Sans SC, sans-serif" font-size="22" font-weight="400" fill="#19344B" text-anchor="middle">记录一次位置历史 → 自动适应屏幕（3%～100%）</text>
<text x="970" y="1370" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" fill="#5C7080" text-anchor="middle">尺寸、配置、连接及选区不变；撤销恢复位置，不恢复旧镜头</text>
<text x="970" y="1400" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" fill="#5C7080" text-anchor="middle">内容过大时最低保持 3%，可能仍超出视窗</text>
<polyline points="250,592 250,612 32,612 32,1434 740,1434" fill="none" stroke="#7D91A1" stroke-width="2" stroke-linejoin="round"/>
<polyline points="970,1332 1450,1332 1450,1434 740,1434" fill="none" stroke="#7D91A1" stroke-width="2" stroke-linejoin="round"/>
<polyline points="740,1434 740,1464" fill="none" stroke="#7D91A1" stroke-width="2" stroke-linejoin="round"/>
<polygon points="740,1464 735,1455 745,1455" fill="#7D91A1"/>
<rect x="470" y="1464" width="540" height="64" rx="14" fill="#F0F6FD" stroke="#367DC4" stroke-width="1.6"/>
<text x="740.0" y="1503.0" font-family="Noto Sans SC, sans-serif" font-size="22" font-weight="400" fill="#19344B" text-anchor="middle">选择图片或编辑节点</text>
<polyline points="740,1528 740,1562" fill="none" stroke="#7D91A1" stroke-width="2" stroke-linejoin="round"/>
<polygon points="740,1562 735,1553 745,1553" fill="#7D91A1"/>
